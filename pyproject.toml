[project]
name = "learning-mcp"
version = "0.1.0"
description = "Token-efficient MCP server for feature-based developer learning reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.27,<3",
]

[project.scripts]
learning-mcp = "learning_mcp.server:main"
learning-mcp-cli = "learning_mcp.cli:main"
learning-mcp-worker = "learning_mcp.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
